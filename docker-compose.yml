services:
  db:
    image: pgvector/pgvector:pg16
    container_name: lethetown-db
    environment:
      POSTGRES_USER: lethetown
      POSTGRES_PASSWORD: lethetown
      POSTGRES_DB: lethetown
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lethetown"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
